# ALL MDM: compila e assina o agente Android com a marca da ALL Tecnologias.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ALL_MDM_KEYSTORE_BASE64    keystore da ALL em base64 (ver ALL-MDM.md)
#   ALL_MDM_KEYSTORE_PASSWORD  senha da keystore
#   ALL_MDM_KEY_ALIAS          alias da chave
#   ALL_MDM_KEY_PASSWORD       senha da chave
#   ALL_MDM_SHARED_SECRET      igual ao SHARED_SECRET do servidor (stack do all-mdm)
#   ALL_MDM_LIBRARY_API_KEY    chave para a biblioteca de integração
#
# A versão fica no arquivo ALL_VERSION (ex.: 6.40-all.1).
# - Todo push na branch "all-branding" compila e guarda o APK como artefato do workflow.
# - Se ainda não existir release para a versão do ALL_VERSION, cria a tag v<versão> e publica o APK.
name: Build ALL MDM agent

on:
  push:
    branches: [all-branding]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restaurar a keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALL_MDM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ALL_MDM_KEYSTORE_BASE64 não configurado. Veja ALL-MDM.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/all-mdm.jks"
          echo "ALL_MDM_KEYSTORE=$RUNNER_TEMP/all-mdm.jks" >> "$GITHUB_ENV"

      - name: Versão
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d ' \r\n' < ALL_VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ALL_MDM_REVISION=${VERSION##*-all.}" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        env:
          ALL_MDM_KEYSTORE_PASSWORD: ${{ secrets.ALL_MDM_KEYSTORE_PASSWORD }}
          ALL_MDM_KEY_ALIAS: ${{ secrets.ALL_MDM_KEY_ALIAS }}
          ALL_MDM_KEY_PASSWORD: ${{ secrets.ALL_MDM_KEY_PASSWORD }}
          ALL_MDM_SHARED_SECRET: ${{ secrets.ALL_MDM_SHARED_SECRET }}
          ALL_MDM_LIBRARY_API_KEY: ${{ secrets.ALL_MDM_LIBRARY_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleAlltecRelease
          mkdir -p dist
          cp app/build/outputs/apk/alltec/release/*.apk "dist/all-mdm-agent-${{ steps.ver.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: all-mdm-agent-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: dist/*

      - name: Publicar no Releases
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ALL MDM agente ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
