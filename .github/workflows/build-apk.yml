# ALL MDM: compila e assina o agente Android com a marca da ALL Tecnologias.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ALL_MDM_KEYSTORE_BASE64    keystore da ALL em base64 (gerada uma única vez, ver ALL-MDM.md)
#   ALL_MDM_KEYSTORE_PASSWORD  senha da keystore
#   ALL_MDM_KEY_ALIAS          alias da chave
#   ALL_MDM_KEY_PASSWORD       senha da chave
#   ALL_MDM_SHARED_SECRET      igual ao SHARED_SECRET do servidor (.env do all-mdm)
#   ALL_MDM_LIBRARY_API_KEY    chave para a biblioteca de integração (qualquer valor longo e aleatório)
#
# - Push na branch "all-branding": gera o APK como artefato do workflow (para testar).
# - Tag no formato v<versão-headwind>-all.<n> (ex.: v6.40-all.1): publica o APK no Releases.
name: Build ALL MDM agent

on:
  push:
    branches: [all-branding]
    tags: ['v*-all.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restaurar a keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALL_MDM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ALL_MDM_KEYSTORE_BASE64 não configurado. Veja ALL-MDM.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/all-mdm.jks"
          echo "ALL_MDM_KEYSTORE=$RUNNER_TEMP/all-mdm.jks" >> "$GITHUB_ENV"

      - name: Revisão da ALL
        run: |
          REV=0
          case "$GITHUB_REF_NAME" in *-all.*) REV="${GITHUB_REF_NAME##*-all.}";; esac
          echo "ALL_MDM_REVISION=$REV" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          ALL_MDM_KEYSTORE_PASSWORD: ${{ secrets.ALL_MDM_KEYSTORE_PASSWORD }}
          ALL_MDM_KEY_ALIAS: ${{ secrets.ALL_MDM_KEY_ALIAS }}
          ALL_MDM_KEY_PASSWORD: ${{ secrets.ALL_MDM_KEY_PASSWORD }}
          ALL_MDM_SHARED_SECRET: ${{ secrets.ALL_MDM_SHARED_SECRET }}
          ALL_MDM_LIBRARY_API_KEY: ${{ secrets.ALL_MDM_LIBRARY_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleAlltecRelease

      - name: Nomear o APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/alltec/release/*.apk "dist/all-mdm-agent-${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: all-mdm-agent-${{ steps.apk.outputs.version }}
          path: dist/*

      - name: Publicar no Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
